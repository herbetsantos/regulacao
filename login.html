<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Acessar — eMulti Regulação</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><style>
body{min-height:100vh;display:grid;place-items:center;background:#f3f6fb}.hybrid-login{width:min(440px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 18px 50px rgba(26,45,85,.10)}.hybrid-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.hybrid-brand img{height:38px}.hybrid-brand strong{color:var(--primary);font-size:19px}.hybrid-login h1{font-size:22px;margin:0 0 6px}.hybrid-login p{color:var(--muted);font-size:13px;margin:0 0 20px}.hybrid-divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0}.hybrid-divider:before,.hybrid-divider:after{content:"";height:1px;background:var(--line);flex:1}.hybrid-login .btn{width:100%;justify-content:center}.login-msg{margin-top:12px;font-size:13px;color:#b42318}.portal-note{margin-top:10px;text-align:center;color:var(--muted);font-size:11px}
</style></head><body><main class="hybrid-login"><div class="hybrid-brand"><img src="/assets/imagotipo.png" alt="Cajamar"><strong>eMulti <span style="font-weight:500">| Regulação</span></strong></div><h1>Acessar a Regulação</h1><p>Entre com sua credencial própria ou utilize sua conta do Portal APS.</p><form id="localForm"><div class="field"><label for="username">Usuário / e-mail</label><input id="username" autocomplete="username" required></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn btn--accent" type="submit">Entrar com credencial própria</button><div class="login-msg" id="msg"></div></form><div class="hybrid-divider"><span>ou</span></div><button class="btn btn--outline" type="button" id="portalBtn">Acessar pelo Portal APS</button><div class="portal-note">Usuários internos continuam utilizando a autenticação central do Portal.</div></main><script>
const PORTAL_URL='https://apoioapscajamar.pages.dev';const params=new URLSearchParams(location.search);const next=params.get('next')||'/painel.html';document.getElementById('portalBtn').onclick=()=>{const target=new URL(next,location.origin).toString();location.href=`${PORTAL_URL}/login.html?next=${encodeURIComponent(target)}`};document.getElementById('localForm').onsubmit=async(e)=>{e.preventDefault();const m=document.getElementById('msg');m.textContent='';const r=await fetch('/api/auth/local-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok){m.textContent=d.error||'Não foi possível entrar.';return}location.href=next.startsWith('/')?next:'/painel.html'};
</script></body></html>
