name: Aplicar migration 030 em producao

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite exatamente: APLICAR 030 PRODUCAO"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: d1-migration-030-producao
  cancel-in-progress: false

jobs:
  migrar:
    name: Migration 030 - regulacao-vagas-db
    if: ${{ github.event.inputs.confirmacao == 'APLICAR 030 PRODUCAO' }}
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_DB: regulacao-vagas-db

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validar credenciais
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Secret CLOUDFLARE_API_TOKEN nao configurado."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID nao configurado."; exit 1; }

      - name: Instalar Wrangler
        run: npm install

      - name: Validar banco antes da migration
        shell: bash
        run: |
          ./node_modules/.bin/wrangler d1 execute "$TARGET_DB" --remote --json             --command="PRAGMA foreign_key_check;" > fk-before.json

          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('fk-before.json','utf8'));
          const blocks = Array.isArray(data) ? data : [data];
          const rows = blocks.flatMap(x => Array.isArray(x?.results) ? x.results : []);
          if (rows.length) {
            console.error('::error::O banco possui ' + rows.length + ' violacao(oes) de chave estrangeira antes da migration.');
            process.exit(1);
          }
          console.log('Integridade referencial antes da migration: OK.');
          NODE

          ./node_modules/.bin/wrangler d1 execute "$TARGET_DB" --remote --json             --command="SELECT sql AS table_sql FROM sqlite_schema WHERE type='table' AND name='pacientes'; SELECT COUNT(*) AS demo_columns FROM pragma_table_info('pacientes') WHERE name IN ('nome_social','identidade_genero'); SELECT COUNT(*) AS temp_tables FROM sqlite_schema WHERE type='table' AND name='pacientes_2_27_2'; SELECT version FROM emulti_schema_version WHERE id=1;"             > migration-status.json

          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('migration-status.json','utf8'));
          const blocks = Array.isArray(data) ? data : [data];
          const rows = blocks.flatMap(x => Array.isArray(x?.results) ? x.results : []);
          const value = (key) => rows.find(r => Object.prototype.hasOwnProperty.call(r,key))?.[key];
          const columns = Number(value('demo_columns') ?? -1);
          const temp = Number(value('temp_tables') ?? -1);
          const sql = String(value('table_sql') || '');
          const version = String(value('version') || '');

          if (temp > 0) {
            console.error('::error::Existe pacientes_2_27_2 de uma tentativa anterior. Intervencao manual necessaria.');
            process.exit(1);
          }
          if (columns === 2) {
            if (!/CHECK\s*\(\s*sexo\s+IN\s*\([^)]*['"]I['"]/i.test(sql)) {
              console.error('::error::As colunas demograficas existem, mas sexo ainda nao aceita I.');
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_ENV, 'MIGRATION_NEEDED=false\n');
            if (version === '2.27.2') {
              fs.appendFileSync(process.env.GITHUB_ENV, 'METADATA_REPAIR_NEEDED=false\n');
              console.log('Migration 030 ja aplicada e metadado do schema em 2.27.2.');
              process.exit(0);
            }
            if (version === '2.27.1') {
              fs.appendFileSync(process.env.GITHUB_ENV, 'METADATA_REPAIR_NEEDED=true\n');
              console.log('Estrutura 2.27.2 confirmada, mas metadado ainda esta em 2.27.1. Sera corrigido sem reconstruir a tabela.');
              process.exit(0);
            }
            console.error('::error::Estrutura 2.27.2 presente, mas versao registrada inesperada: ' + version);
            process.exit(1);
          }
          if (columns !== 0) {
            console.error('::error::Schema demografico parcial detectado. Migration automatica cancelada.');
            process.exit(1);
          }
          if (version !== '2.27.1') {
            console.error('::error::Schema anterior inesperado para aplicar a migration 030: ' + version);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, 'MIGRATION_NEEDED=true\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'METADATA_REPAIR_NEEDED=false\n');
          console.log('Banco 2.27.1 apto para receber a migration 030.');
          NODE

      - name: Aplicar migration 030
        if: env.MIGRATION_NEEDED == 'true'
        shell: bash
        run: |
          test -s ./database/030_paciente_diversidade.sql || { echo "::error::Migration 030 nao encontrada."; exit 1; }
          ./node_modules/.bin/wrangler d1 execute "$TARGET_DB" --remote             --file=./database/030_paciente_diversidade.sql --yes

      - name: Sincronizar metadado do schema
        if: env.METADATA_REPAIR_NEEDED == 'true'
        shell: bash
        run: |
          ./node_modules/.bin/wrangler d1 execute "$TARGET_DB" --remote --yes \
            --command="INSERT INTO emulti_schema_version(id,version,updated_at) VALUES(1,'2.27.2',datetime('now')) ON CONFLICT(id) DO UPDATE SET version='2.27.2',updated_at=datetime('now');"

      - name: Validar migration
        shell: bash
        run: |
          ./node_modules/.bin/wrangler d1 execute "$TARGET_DB" --remote --json             --command="PRAGMA foreign_key_check;" > fk-after.json

          ./node_modules/.bin/wrangler d1 execute "$TARGET_DB" --remote --json             --command="SELECT COUNT(*) AS demo_columns FROM pragma_table_info('pacientes') WHERE name IN ('nome_social','identidade_genero'); SELECT version FROM emulti_schema_version WHERE id=1; SELECT sql AS table_sql FROM sqlite_schema WHERE type='table' AND name='pacientes';"             > migration-after.json

          node - <<'NODE'
          const fs = require('fs');
          const parseRows = (file) => {
            const data = JSON.parse(fs.readFileSync(file,'utf8'));
            const blocks = Array.isArray(data) ? data : [data];
            return blocks.flatMap(x => Array.isArray(x?.results) ? x.results : []);
          };
          const fk = parseRows('fk-after.json');
          if (fk.length) {
            console.error('::error::A migration terminou com violacoes de chave estrangeira.');
            process.exit(1);
          }

          const rows = parseRows('migration-after.json');
          const value = (key) => rows.find(r => Object.prototype.hasOwnProperty.call(r,key))?.[key];
          const columns = Number(value('demo_columns') ?? -1);
          const version = String(value('version') || '');
          const sql = String(value('table_sql') || '');

          if (columns !== 2) {
            console.error('::error::As colunas nome_social e identidade_genero nao foram confirmadas.');
            process.exit(1);
          }
          if (!/CHECK\s*\(\s*sexo\s+IN\s*\([^)]*['"]I['"]/i.test(sql)) {
            console.error('::error::A tabela pacientes nao foi confirmada com sexo Indeterminado.');
            process.exit(1);
          }
          if (version !== '2.27.2') {
            console.error('::error::Versao do schema inesperada: ' + version);
            process.exit(1);
          }
          console.log('Migration 030 validada. Integridade referencial: OK. Schema: 2.27.2.');
          NODE

      - name: Limpar arquivos temporarios
        if: always()
        shell: bash
        run: rm -f fk-before.json migration-status.json fk-after.json migration-after.json
