name = "regulacao"
compatibility_date = "2026-09-23"
main = "./dist/worker/index.js"
workers_dev = true
preview_urls = true

# O código ainda usa o roteamento das antigas Pages Functions. Este build
# compila functions/ em um único Worker antes de cada deploy do Wrangler.
[build]
command = "npm run build"

# Apenas arquivos públicos entram no pacote de Static Assets.
[assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = true

# Banco do Apoio APS usado somente para autenticação/handoff e transição.
[[d1_databases]]
binding = "DB"
database_name = "portal-saude-db"
database_id = "d20e8935-68c2-47cb-8a88-69162fb9feaa"

# Banco próprio da eMulti/Regulação.
# Producao: regulacao-vagas-db. Homologacao permanece isolada no env abaixo.
[[d1_databases]]
binding = "DB_REGULACAO"
database_name = "regulacao-vagas-db"
database_id = "d13defa7-1e22-43e3-b55f-468261dcaf74"

# Ambiente isolado de homologacao.
# Bindings D1 nao sao herdados entre ambientes, por isso sao declarados aqui.
[env.homologacao]
name = "regulacao-homologacao"

[[env.homologacao.d1_databases]]
binding = "DB"
database_name = "portal-saude-db"
database_id = "d20e8935-68c2-47cb-8a88-69162fb9feaa"

[[env.homologacao.d1_databases]]
binding = "DB_REGULACAO"
database_name = "regulacao-vagas-db-homolog"
database_id = "75c5bcdf-81be-46b9-ae86-85d3a3f65a14"
