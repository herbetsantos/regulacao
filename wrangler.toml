name = "regulacao"
compatibility_date = "2026-09-23"
main = "./dist/worker/index.js"
workers_dev = true
preview_urls = true

# O código ainda usa o roteamento das antigas Pages Functions. Este build
# compila functions/ em um único Worker antes de cada deploy do Wrangler.
[build]
command = "npm run build"

# Apenas arquivos públicos entram no pacote de Static Assets.
[assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = true

# Banco do Apoio APS usado somente para autenticação/handoff e transição.
[[d1_databases]]
binding = "DB"
database_name = "portal-saude-db"
database_id = "4467670b-0e48-490a-8d56-fb4ad4cf6bce"

# Banco próprio da eMulti/Regulação. É a única base operacional do módulo.
[[d1_databases]]
binding = "DB_REGULACAO"
database_name = "regulacao-vagas-db"
database_id = "d13defa7-1e22-43e3-b55f-468261dcaf74"

# Homologação é apenas de código/Worker. Ela compartilha o mesmo D1 operacional
# de produção; não existe banco secundário de homologação.
[env.homologacao]
name = "regulacao-homologacao"

[[env.homologacao.d1_databases]]
binding = "DB"
database_name = "portal-saude-db"
database_id = "4467670b-0e48-490a-8d56-fb4ad4cf6bce"

[[env.homologacao.d1_databases]]
binding = "DB_REGULACAO"
database_name = "regulacao-vagas-db"
database_id = "d13defa7-1e22-43e3-b55f-468261dcaf74"
