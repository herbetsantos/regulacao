<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/js/theme.js"></script>
<title>Minha conta — eMulti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .account-card { max-width:620px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px; box-shadow:var(--shadow); }
  .account-card .field { max-width:460px; }
</style>
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<div id="app-topbar"></div>
<main class="page">
  <div class="page__header">
    <div class="eyebrow">Minha conta</div>
    <h1 class="page__title">Alterar senha</h1>
    <p class="page__subtitle">A senha é a mesma utilizada no Portal Saúde Cajamar.</p>
  </div>
  <section class="account-card">
    <form id="passwordForm">
      <div class="field">
        <label for="curPass">Senha atual</label>
        <input type="password" id="curPass" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="newPass">Nova senha</label>
        <input type="password" id="newPass" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field">
        <label for="newPass2">Confirmar nova senha</label>
        <input type="password" id="newPass2" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="form-msg" id="passwordMsg"></div>
      <button class="btn btn--accent" type="submit" id="savePassword">Salvar nova senha</button>
    </form>
  </section>
</main>
<script src="/js/app-chrome.js"></script>
<script src="/js/regulacao.js"></script>
<script>
(async () => {
  const user = await initPortalChrome();
  if (!user) return;
  const form = document.getElementById('passwordForm');
  const msg = document.getElementById('passwordMsg');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'form-msg';
    msg.textContent = '';
    const currentPassword = document.getElementById('curPass').value;
    const newPassword = document.getElementById('newPass').value;
    const confirm = document.getElementById('newPass2').value;
    if (newPassword !== confirm) {
      msg.className = 'form-msg is-error';
      msg.textContent = 'As novas senhas não coincidem.';
      return;
    }
    const btn = document.getElementById('savePassword');
    btn.disabled = true;
    const { ok, data } = await apiFetch('/api/change-password', {
      method: 'POST',
      body: JSON.stringify({ currentPassword, newPassword }),
    });
    btn.disabled = false;
    if (!ok) {
      msg.className = 'form-msg is-error';
      msg.textContent = data?.error || 'Não foi possível alterar a senha.';
      return;
    }
    form.reset();
    msg.className = 'form-msg is-ok';
    msg.textContent = 'Senha alterada com sucesso. As outras sessões abertas foram encerradas.';
  });
})();
</script>
</body>
</html>
