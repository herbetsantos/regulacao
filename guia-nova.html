<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Guia — Regulação de Vagas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .reg-form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  .reg-paciente-box { background:#f5f7fa; border-radius:8px; padding:14px 18px; margin-bottom:20px; }
  .reg-aviso { background:#fff7e6; border:1px solid #f0c36d; border-radius:8px; padding:14px 18px; margin:16px 0; font-size:14px; }
  .reg-aviso ul { margin:8px 0 0 20px; }
</style>
</head>
<body>

<div id="app-topbar"></div>

<main class="page">
  <div class="page__header">
    <div class="eyebrow">Regulação de Vagas</div>
    <h1 class="page__title">Nova Guia de Encaminhamento</h1>
    <p class="page__subtitle">Informe o paciente pelo CPF. Se ele não estiver cadastrado, você será direcionado ao cadastro.</p>
  </div>

  <div class="field" style="max-width:280px">
    <label for="gCpf">CPF do paciente *</label>
    <input type="text" id="gCpf" maxlength="14" required>
  </div>
  <div id="pacienteBox"></div>

  <form id="guiaForm" style="margin-top:20px; display:none">
    <div class="reg-form-grid">
      <div class="field">
        <label for="gUnidadeSolicitante">Unidade solicitante *</label>
        <select id="gUnidadeSolicitante" required><option value="">Selecione</option></select>
      </div>
      <div class="field">
        <label for="gMedico">Médico solicitante *</label>
        <input type="text" id="gMedico" required>
      </div>
      <div class="field">
        <label for="gEspecialidade">Especialidade *</label>
        <select id="gEspecialidade" required><option value="">Selecione</option></select>
      </div>
      <div class="field">
        <label for="gCid10">CID-10</label>
        <input type="text" id="gCid10" placeholder="Ex.: M54.5">
      </div>
      <div class="field" style="grid-column:1/-1">
        <label for="gMotivo">Motivo do encaminhamento *</label>
        <textarea id="gMotivo" rows="4" required></textarea>
      </div>
    </div>

    <div id="avisoArea"></div>

    <div class="form-msg" id="formMsg"></div>
    <div class="inline-form__actions" style="margin-top:16px">
      <button class="btn btn--accent" type="submit" id="btnSalvar">Criar guia</button>
    </div>
  </form>
</main>

<script src="/js/app-chrome.js"></script>
<script src="/js/regulacao.js"></script>
<script>
(async () => {
  const user = await initPortalChrome();
  if (!user) return;

  const [unidResp, especResp] = await Promise.all([
    apiFetch('/api/unidades'),
    apiFetch('/api/especialidades'),
  ]);

  const unidSel = document.getElementById('gUnidadeSolicitante');
  if (unidResp.ok) {
    const lista = unidResp.data.isAdmin ? unidResp.data.todas : unidResp.data.minhasEmissoras;
    if (lista.length === 0) {
      unidSel.insertAdjacentHTML('beforeend', `<option value="">Nenhuma unidade emissora vinculada ao seu usuário</option>`);
    }
    lista.forEach((u) => unidSel.insertAdjacentHTML('beforeend', `<option value="${u.code}">${escapeHtml(u.nome)}</option>`));
  }

  const especSel = document.getElementById('gEspecialidade');
  if (especResp.ok) {
    especResp.data.especialidades.forEach((e) => especSel.insertAdjacentHTML('beforeend', `<option value="${e.id}">${escapeHtml(e.nome)}</option>`));
  }

  let pacienteAtual = null;
  let confirmarMesmoAssim = false;

  const cpfInput = document.getElementById('gCpf');
  cpfInput.addEventListener('input', (e) => { e.target.value = maskCPF(e.target.value); });

  const paramsUrl = new URLSearchParams(window.location.search);
  const cpfPrefill = paramsUrl.get('cpf');
  if (cpfPrefill) { cpfInput.value = maskCPF(cpfPrefill); buscarPaciente(); }

  cpfInput.addEventListener('blur', buscarPaciente);

  async function buscarPaciente() {
    const cpf = onlyDigits(cpfInput.value);
    const box = document.getElementById('pacienteBox');
    const form = document.getElementById('guiaForm');
    if (cpf.length !== 11) return;

    const { ok, data } = await apiFetch(`/api/pacientes?cpf=${cpf}`);
    const pacientes = ok ? (data.pacientes || []) : [];

    if (pacientes.length === 0) {
      pacienteAtual = null;
      form.style.display = 'none';
      box.innerHTML = `<div class="empty-state">Paciente não encontrado. <a href="/paciente.html">Cadastrar paciente</a> primeiro.</div>`;
      return;
    }

    pacienteAtual = pacientes[0];
    box.innerHTML = `
      <div class="reg-paciente-box">
        <strong>${escapeHtml(pacienteAtual.nome)}</strong> — ${formatDateBR(pacienteAtual.data_nascimento)}, ${pacienteAtual.sexo === 'F' ? 'Feminino' : 'Masculino'}<br>
        Unidade de referência: ${escapeHtml(pacienteAtual.unidade_referencia_code)}
      </div>`;
    form.style.display = '';
  }

  document.getElementById('guiaForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!pacienteAtual) return;
    const msg = document.getElementById('formMsg');
    const avisoArea = document.getElementById('avisoArea');
    msg.textContent = '';

    const payload = {
      cpf: pacienteAtual.cpf,
      unidade_solicitante_code: unidSel.value,
      medico_solicitante: document.getElementById('gMedico').value.trim(),
      especialidade_id: especSel.value,
      cid10: document.getElementById('gCid10').value.trim(),
      motivo: document.getElementById('gMotivo').value.trim(),
      confirmar_mesmo_assim: confirmarMesmoAssim,
    };

    const { ok, data } = await apiFetch('/api/guias', { method: 'POST', body: JSON.stringify(payload) });

    if (ok && data.aviso) {
      avisoArea.innerHTML = `
        <div class="reg-aviso">
          ⚠️ ${escapeHtml(data.mensagem)}
        </div>`;
      confirmarMesmoAssim = true;
      document.getElementById('btnSalvar').textContent = 'Confirmar mesmo assim e criar guia';
      return;
    }

    if (!ok) { msg.textContent = data?.error || 'Erro ao criar guia.'; msg.style.color = '#c0392b'; return; }

    window.location.href = `/guia-detalhe.html?id=${data.guia.id}`;
  });
})();
</script>
</body>
</html>
