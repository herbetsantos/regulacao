<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><script src="/js/theme.js"></script><title>Painel — eMulti Regulação</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/theme.css"><style>.dashboard-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:22px}.role-pills{display:flex;gap:7px;flex-wrap:wrap}.role-pill{font-size:11px;font-weight:700;padding:6px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}.dashboard-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.metric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between}.metric__label{font-size:12px;font-weight:700;color:var(--muted)}.metric__value{font-size:30px;font-weight:800;color:var(--ink);line-height:1}.metric__link{font-size:12px;font-weight:700;color:var(--primary);text-decoration:none}.role-sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.role-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}.role-card h2{font-size:17px;margin:0 0 5px;color:var(--ink)}.role-card p{font-size:13px;color:var(--muted);margin:0 0 16px}.quick-actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:1000px){.dashboard-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.dashboard-grid,.role-sections{grid-template-columns:1fr}}</style></head><body><div id="app-topbar"></div><main class="page"><div class="dashboard-head"><div><div class="eyebrow">eMulti Regulação</div><h1 class="page__title">Painel</h1><p class="page__subtitle">Visão de trabalho conforme suas responsabilidades.</p></div><div class="role-pills" id="rolePills"></div></div><div class="dashboard-grid" id="metrics"><div class="skeleton-loading">Carregando indicadores…</div></div><div class="role-sections" id="roleSections"></div></main><script src="/js/app-chrome.js"></script><script src="/js/regulacao.js"></script><script>(async()=>{const user=await initPortalChrome();if(!user)return;const a=user.regulacao||{};const roles=[];if(a.cadastrante)roles.push('Cadastrante');if(a.regulador)roles.push('Regulador');if(a.executor)roles.push('Executor');if(a.administrador)roles.push('Administrador');rolePills.innerHTML=roles.map(r=>`<span class="role-pill">${r}</span>`).join('');const count=async(params='')=>{const r=await apiFetch('/api/guias?page=1&page_size=1'+(params?'&'+params:''));return r.ok?Number(r.data.total||0):0};const jobs=[];if(a.regulador||a.administrador)jobs.push(['Aguardando regulação','situacao=aguardando_autorizacao','/?situacao=aguardando_autorizacao'],['Lista de espera','situacao=lista_espera','/?situacao=lista_espera']);if(a.executor||a.administrador)jobs.push(['Em atendimento','situacao=em_atendimento','/?situacao=em_atendimento']);if(a.cadastrante||a.administrador)jobs.push(['Meus encaminhamentos','meus=1','/?meus=1']);const unique=jobs.filter((x,i)=>jobs.findIndex(y=>y[0]===x[0])===i).slice(0,4);const vals=await Promise.all(unique.map(x=>count(x[1])));metrics.innerHTML=unique.map((x,i)=>`<article class="metric"><span class="metric__label">${x[0]}</span><strong class="metric__value">${vals[i]}</strong><a class="metric__link" href="${x[2]}">Ver registros →</a></article>`).join('')||'<div class="empty-state">Nenhum indicador disponível.</div>';const cards=[];if(a.cadastrante||a.administrador)cards.push(`<section class="role-card"><h2>Cadastro e encaminhamentos</h2><p>Cadastre pacientes, emita novas guias e acompanhe os encaminhamentos criados por você.</p><div class="quick-actions"><a class="btn btn--accent btn--sm" href="/guia-nova.html">+ Nova guia</a><a class="btn btn--outline btn--sm" href="/paciente.html">Pacientes</a><a class="btn btn--outline btn--sm" href="/?meus=1">Meus encaminhamentos</a></div></section>`);if(a.regulador||a.administrador)cards.push(`<section class="role-card"><h2>Regulação</h2><p>Priorize as guias que aguardam decisão e acompanhe a lista de espera.</p><div class="quick-actions"><a class="btn btn--accent btn--sm" href="/?situacao=aguardando_autorizacao&ordem=antigas">Regular mais antigas</a><a class="btn btn--outline btn--sm" href="/?situacao=lista_espera">Lista de espera</a><a class="btn btn--outline btn--sm" href="/">Pesquisar guias</a></div></section>`);if(a.executor||a.administrador)cards.push(`<section class="role-card"><h2>Execução e acompanhamento</h2><p>Acesse pacientes em atendimento e registre a continuidade assistencial pela guia.</p><div class="quick-actions"><a class="btn btn--accent btn--sm" href="/agenda.html">Minha agenda</a><a class="btn btn--outline btn--sm" href="/?situacao=em_atendimento">Em atendimento</a><a class="btn btn--outline btn--sm" href="/paciente.html">Pesquisar paciente</a></div></section>`);if(a.administrador)cards.push(`<section class="role-card"><h2>Administração</h2><p>Gerencie equipes, profissionais, responsabilidades, unidades e especialidades.</p><div class="quick-actions"><a class="btn btn--accent btn--sm" href="/admin.html">Abrir administração</a></div></section>`);roleSections.innerHTML=cards.join('')})();</script></body></html>
