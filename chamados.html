<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/js/theme.js"></script><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/theme.css"><title>Chamados</title></head><body><div id="app-topbar"></div><main class="app-main"><div class="page-head"><div><div class="eyebrow">Administração</div><h1>Chamados</h1><p class="muted">Acompanhe ocorrências do Portal Saúde e do eMulti.</p></div></div><div id="grid" class="ticket-grid"></div></main><script src="/js/app-chrome.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let me;
async function load(){const r=await fetch('/api/chamados');const d=await r.json();if(!r.ok){location.href='/painel.html';return;}document.getElementById('grid').innerHTML=(d.chamados||[]).map(c=>`<article class="ticket-card"><div><strong>${esc(c.codigo||'#'+c.id)} — ${esc(c.title)}</strong></div><p>${esc(c.description||'Sem descrição')}</p><div class="muted">${esc(c.platform)} · ${esc(c.requester_name)} · ${esc(c.priority)} · ${esc(c.status)}</div>${d.super_admin?`<div style="display:flex;gap:8px;margin-top:12px"><select data-status="${c.id}">${['aberto','em_analise','em_atendimento','aguardando_usuario','resolvido','encerrado'].map(x=>`<option ${x===c.status?'selected':''}>${x}</option>`).join('')}</select><select data-priority="${c.id}">${['baixa','normal','alta','critica'].map(x=>`<option ${x===c.priority?'selected':''}>${x}</option>`).join('')}</select></div>`:''}</article>`).join('')||'<div class="empty-state">Nenhum chamado.</div>';document.querySelectorAll('[data-status],[data-priority]').forEach(el=>el.onchange=async()=>{const id=el.dataset.status||el.dataset.priority;await fetch('/api/chamados/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(el.dataset.status?{status:el.value}:{priority:el.value})});load();});}
(async()=>{me=await initPortalChrome();if(!me)return;if(me.role!=='super_admin'){location.href='/painel.html';return;}load();})();
</script></body></html>
